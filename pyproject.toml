[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "graphgps-bench"
version = "0.1.0"
description = "Offline-gated GraphGPS benchmark contracts for OGB molecular HIV."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
runtime = [
  "torch",
  "torch-geometric",
  "ogb",
]
report = [
  "matplotlib",
]
wandb = [
  "wandb",
]
test = [
  "pytest",
]

[project.scripts]
graphgps-bench = "graphgps_bench.cli:main"
graphgps-bench-static = "graphgps_bench.static_validation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["graphgps_bench*"]
