task_name = "ogbg-molhiv"
split = "scaffold"
models = ["gcn", "gin", "gps"]
seeds = [0, 1, 2]
output_root = "results/ogbg_molhiv"
device = "cuda"
allow_network = true
allow_ogb_download = true
allow_gpu = true
allow_wandb = false

[budget]
epochs = 1
batch_size = 32
learning_rate = 0.001
early_stopping_patience = 0

[gps]
positional_encoding = "laplacian_eigenvectors"
positional_dim = 4
local_layer = "GINConv"
global_attention = "MultiheadAttention"
hidden_dim = 16
layers = 2
dropout = 0.0

[selected_versions]
torch-geometric = "2.7.0"
ogb = "1.3.6"
